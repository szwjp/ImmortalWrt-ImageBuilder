name: Build ImmortalWrt x86-64

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "完整版本号 (25.12.x; 官方目前只发布到 25.12.2)"
        required: true
        default: "25.12.2"
        type: choice
        options:
          - 25.12.0
          - 25.12.1
          - 25.12.2
      output_format:
        description: "输出格式"
        required: true
        default: "img"
        type: choice
        options:
          - img
          - iso
      custom_router_ip:
        description: "路由器管理地址 (仅多网口有效) 格式:192.168.x.1 或 10.x.x.1"
        required: true
        default: "192.168.1.1"
      profile:
        description: '固件大小 单位(MB), 至少 256'
        required: true
        default: '1024'
      include_docker:
        description: "是否编译 Docker 插件"
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_pppoe:
        description: "是否配置PPPoE拨号信息?"
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      pppoe_account:
        description: "宽带账号 (若启用PPPoE)"
        required: false
      pppoe_password:
        description: "宽带密码 (若启用PPPoE)"
        required: false

permissions:
  contents: write

# release 的 tag 是固定的两个(Autobuild-x86-64 / Custom-Installer-x86_64-ISO),
# 并发 dispatch 会互相覆盖同名资产, 还会让 draft->published 的日期刷新交错,
# 最终 release 是发布还是 draft 取决于时序。这里串行化整条构建链。
concurrency:
  group: build-x86-64
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate inputs
        run: |
          luci_version="${{ inputs.luci_version }}"
          case "$luci_version" in
            25.12.*) ;;
            *)
              echo "::error::只支持 25.12.x, 当前: $luci_version"
              exit 1
              ;;
          esac
          custom_router_ip="${{ inputs.custom_router_ip }}"
          # 逐段校验 0-255, 与 99-custom.sh 里的正则保持一致(两处必须同步)。
          # 只校验 "四段数字" 是不够的: 999.999.999.999 也能过, 写进
          # network.lan.ipaddr 后 netifd 无法绑定, 管理地址失联。
          if ! [[ "$custom_router_ip" =~ ^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$ ]]; then
            echo "::error::路由器管理地址格式非法: $custom_router_ip"
            exit 1
          fi
          if [[ "${{ inputs.enable_pppoe }}" == "yes" ]]; then
            if [[ -z "${{ inputs.pppoe_account }}" || -z "${{ inputs.pppoe_password }}" ]]; then
              echo "Error: PPPoE account and password must be provided when PPPoE is enabled!"
              exit 1
            fi
          fi
          # 固件大小必须是正整数(单位 MB)。原先是自由文本, 传非数字会让
          # ROOTFS_PARTSIZE 变成无效值, 构建产物大小与预期不符。
          profile="${{ inputs.profile }}"
          if ! [[ "$profile" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::固件大小必须是正整数(MB), 当前: $profile"
            exit 1
          fi
          # 下限: 32MB 内核分区 + 核心包集, 低于 256MB 时 rootfs 放不下,
          # 会在 gen_image_generic.sh 阶段失败(报错点深且不直观)。
          if [ "$profile" -lt 256 ]; then
            echo "::error::固件大小至少 256MB, 当前: $profile"
            exit 1
          fi

      - name: Run shell tests
        run: |
          # 构建脚本自测(全部不联网): 解析规则/包集合静态断言/release 日期刷新
          # 任何一条失败即构建失败, 不让规则回归拖到出图后才发现
          sh shell/tests/run-all.sh

      - name: Save Custom Router IP
        run: |
          mkdir -p "${{ github.workspace }}/custom"
          echo "${{ inputs.custom_router_ip }}" > "${{ github.workspace }}/custom/custom_router_ip.txt"

      # 镜像按 digest 钉死: tag 会被上游重新推送, digest 不会。ISO 链路里
      # debian:buster 已经是这么钉的, 这里保持一致; 否则同一份 workflow 在不同
      # 时间跑出来的固件可能来自不同的 ImageBuilder 内容。
      - name: Resolve ImageBuilder image digest
        id: ib
        run: |
          case "${{ inputs.luci_version }}" in
            25.12.0) digest="sha256:5ef244d7d795f53ddc7a11cdefaf0c264336d7f3dedc23305c97cd65dd579f6c" ;;
            25.12.1) digest="sha256:600dbc0bb7c0b0ca6d6b3b783061599bb93e19e220e416ab21911c6d15dc7049" ;;
            25.12.2) digest="sha256:7ea93e502bfe8b09f3a0d8f8b7d3d244ecc0fbcd5207cf264abf79f5ef9b925e" ;;
            *)
              echo "::error::没有为 ${{ inputs.luci_version }} 钉 ImageBuilder digest, 请先补 digest 映射"
              exit 1
              ;;
          esac
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Build ImmortalWrt firmware
        env:
          # 凭据一律走 env: Actions 会把 run: 脚本全文回显到日志, 内联
          # ${{ inputs.* }} 等于把宽带密码明文打进运行日志; 未加引号时含空格/
          # 引号的值还会被 shell 拆错参数。这里由 shell 变量引用, 不出现在脚本里。
          LUCI_VERSION: ${{ inputs.luci_version }}
          PROFILE: ${{ inputs.profile }}
          INCLUDE_DOCKER: ${{ inputs.include_docker }}
          ENABLE_PPPOE: ${{ inputs.enable_pppoe }}
          PPPOE_ACCOUNT: ${{ inputs.pppoe_account }}
          PPPOE_PASSWORD: ${{ inputs.pppoe_password }}
        run: |
          # 只构建一档。ImageBuilder 的产物文件名由版本/架构/镜像类型决定,
          # 不含 rootfs 大小(ROOTFS_PARTSIZE 只影响分区大小), 多档会写进同一个
          # 路径互相覆盖, 最终只剩最后一档且与用户预期不符 —— 所以这里只保留单档。
          echo "Building for profile: $PROFILE (luci_version=$LUCI_VERSION, image=immortalwrt/imagebuilder@${{ steps.ib.outputs.digest }})"
          docker run --rm -i \
            --user root \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
            -v "${{ github.workspace }}/custom:/home/build/immortalwrt/files/etc/config" \
            -v "${{ github.workspace }}/x86-64/imm.config:/home/build/immortalwrt/.config" \
            -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
            -v "${{ github.workspace }}/x86-64/build.sh:/home/build/immortalwrt/build.sh" \
            -e LUCI_VERSION="$LUCI_VERSION" \
            -e PROFILE="$PROFILE" \
            -e INCLUDE_DOCKER="$INCLUDE_DOCKER" \
            -e ENABLE_PPPOE="$ENABLE_PPPOE" \
            -e PPPOE_ACCOUNT="$PPPOE_ACCOUNT" \
            -e PPPOE_PASSWORD="$PPPOE_PASSWORD" \
            "immortalwrt/imagebuilder@${{ steps.ib.outputs.digest }}" /bin/bash /home/build/immortalwrt/build.sh

      - name: Create info
        run: |
          cat > ${{ github.workspace }}/router-info.md <<EOF
          ## 📡 路由器后台信息

          - 🏠 **后台地址**: ${{ inputs.custom_router_ip }}
          - 👤 **用户名**: root
          - 🔑 **密码**: 无
          - 📦 **版本**: ${{ inputs.luci_version }}
          EOF

          if [ "${{ inputs.include_docker }}" == "yes" ]; then
            echo -e "\n#### 默认带docker" >> ${{ github.workspace }}/router-info.md
          else
            echo -e "\n#### 不带docker" >> ${{ github.workspace }}/router-info.md
          fi

          cat >> ${{ github.workspace }}/router-info.md <<'EOF'

          #### 附件校验

          - `<固件>.sha256`: 下载后执行 `sha256sum -c <固件>.sha256` 校验完整性
          - `<固件>.manifest`: 固件内软件包清单, 可直接核对装了哪些包
          EOF

      # 发布资产统一先落到 dist/: 固件 + sha256 + ImageBuilder 的 .manifest。
      # 直接从 bin/ 上传没法附带校验和与清单, 也不好区分资产类型。
      - name: Stage release assets (img)
        if: inputs.output_format == 'img'
        run: |
          set -euo pipefail
          dist="${{ github.workspace }}/dist"
          rm -rf "$dist"
          mkdir -p "$dist"
          img=$(ls "${{ github.workspace }}"/bin/targets/x86/64/*squashfs-combined-efi.img.gz)
          cp "$img" "$dist/"
          ( cd "$dist" && sha256sum "$(basename "$img")" > "$(basename "$img").sha256" )
          for m in "${{ github.workspace }}"/bin/targets/x86/64/*.manifest; do
            [ -f "$m" ] || continue
            cp "$m" "$dist/"
          done
          ls -l "$dist"

      - name: Upload firmware as release (img)
        if: inputs.output_format == 'img'
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: Autobuild-x86-64
          body_path: ${{ github.workspace }}/router-info.md
          files: |
            ${{ github.workspace }}/dist/*
          token: ${{ secrets.GITHUB_TOKEN }}

      # release 列表页显示的日期是 published_at, 它只在 release 从 draft 变成
      # published 时刷新。上面这一步走的是"找到已有 release 并覆盖同名资产",
      # published_at 会一直停在首次发布的时间, 页面于是显示过期日期。
      # 这里做一次 draft -> published 往返, 让日期跟随本次构建(资产不受影响)。
      - name: Refresh release publish date (img)
        if: inputs.output_format == 'img'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: sh shell/refresh-release-date.sh Autobuild-x86-64

      # 兜底: 日期刷新是 "先转 draft 再转回 published", 中途失败/超时会把
      # release 卡在 draft(对外直接消失)。任何退出路径都再确认一次它是 published。
      - name: Ensure img release is published
        if: always() && inputs.output_format == 'img'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: sh shell/refresh-release-date.sh --ensure-published Autobuild-x86-64

      - name: Copy firmware for ISO
        if: inputs.output_format == 'iso'
        run: cp ${{ github.workspace }}/bin/targets/x86/64/*squashfs-combined-efi.img.gz ${{ github.workspace }}/

      - name: Upload firmware artifact (for ISO)
        if: inputs.output_format == 'iso'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-img
          path: "*.img.gz"

  build_iso:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    needs: build
    if: inputs.output_format == 'iso'

    steps:
      # ISO 构建脚本已 vendored 进本仓库的 iso/ 目录, 不再 clone 第三方仓库。
      # 需要 checkout 才能拿到 iso/ 下的脚本。
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-img

      # 先把基础镜像拉下来, 失败重试三次。autobuild.sh 里 docker run 会隐式
      # pull, 一次网络抖动就让整步失败(而且从报错看不出是网络问题)。
      # 镜像引用从脚本里取, 不在这里重复写 digest, 免得两处漂移。
      - name: Pre-pull ISO builder image
        run: |
          set -euo pipefail
          image=$(grep -oE 'debian:buster@sha256:[0-9a-f]{64}' iso/autobuild.sh | head -1)
          [ -n "$image" ] || { echo "::error::iso/autobuild.sh 里找不到钉死的镜像引用"; exit 1; }
          attempt=1
          while [ "$attempt" -le 3 ]; do
            if docker pull "$image"; then
              exit 0
            fi
            echo "拉取 $image 失败(第 $attempt 次), 重试"
            attempt=$((attempt + 1))
            sleep 5
          done
          echo "::error::拉取 $image 连续失败 3 次"
          exit 1

      - name: Build ISO
        run: |
          firmware_file=$(ls *squashfs-combined-efi.img.gz)
          bash iso/autobuild.sh "$firmware_file"

      - name: Stage release assets (ISO)
        run: |
          set -euo pipefail
          dist="${{ github.workspace }}/dist"
          rm -rf "$dist"
          mkdir -p "$dist"
          cp iso/output/custom-installer-x86_64.iso "$dist/"
          ( cd "$dist" && sha256sum custom-installer-x86_64.iso > custom-installer-x86_64.iso.sha256 )
          ls -l "$dist"

      - name: Upload ISO to Release
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: "Custom-Installer-x86_64-ISO"
          body_path: "${{ github.workspace }}/iso/info.md"
          files: |
            ${{ github.workspace }}/dist/*
          token: "${{ secrets.GITHUB_TOKEN }}"

      # 与 img release 同理: 刷新 published_at, 让列表页日期跟随本次构建
      - name: Refresh release publish date (ISO)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: sh shell/refresh-release-date.sh Custom-Installer-x86_64-ISO

      - name: Ensure ISO release is published
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: sh shell/refresh-release-date.sh --ensure-published Custom-Installer-x86_64-ISO
