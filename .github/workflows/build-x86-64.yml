name: Build ImmortalWrt x86-64

on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "完整版本号 (25.12.x; 官方目前只发布到 25.12.2)"
        required: true
        default: "25.12.2"
        type: choice
        options:
          - 25.12.0
          - 25.12.1
          - 25.12.2
      output_format:
        description: "输出格式"
        required: true
        default: "img"
        type: choice
        options:
          - img
          - iso
      custom_router_ip:
        description: "路由器管理地址 (仅多网口有效) 格式:192.168.x.1 或 10.x.x.1"
        required: true
        default: "192.168.1.1"
      profile:
        description: '固件大小 单位(MB)'
        required: true
        default: '1024'
      include_docker:
        description: "是否编译 Docker 插件"
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_pppoe:
        description: "是否配置PPPoE拨号信息?"
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      pppoe_account:
        description: "宽带账号 (若启用PPPoE)"
        required: false
      pppoe_password:
        description: "宽带密码 (若启用PPPoE)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/x86-64/build.sh

      - name: Validate inputs
        run: |
          luci_version="${{ inputs.luci_version }}"
          case "$luci_version" in
            25.12.*) ;;
            *)
              echo "::error::只支持 25.12.x, 当前: $luci_version"
              exit 1
              ;;
          esac
          custom_router_ip="${{ inputs.custom_router_ip }}"
          # 逐段校验 0-255, 与 99-custom.sh 里的正则保持一致(两处必须同步)。
          # 只校验 "四段数字" 是不够的: 999.999.999.999 也能过, 写进
          # network.lan.ipaddr 后 netifd 无法绑定, 管理地址失联。
          if ! [[ "$custom_router_ip" =~ ^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])$ ]]; then
            echo "::error::路由器管理地址格式非法: $custom_router_ip"
            exit 1
          fi
          if [[ "${{ inputs.enable_pppoe }}" == "yes" ]]; then
            if [[ -z "${{ inputs.pppoe_account }}" || -z "${{ inputs.pppoe_password }}" ]]; then
              echo "Error: PPPoE account and password must be provided when PPPoE is enabled!"
              exit 1
            fi
          fi
          # 固件大小必须是正整数(单位 MB)。原先是自由文本, 传非数字会让
          # ROOTFS_PARTSIZE 变成无效值, 构建产物大小与预期不符。
          profile="${{ inputs.profile }}"
          if ! [[ "$profile" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::固件大小必须是正整数(MB), 当前: $profile"
            exit 1
          fi

      - name: Run shell tests
        run: |
          # 构建脚本自测(全部不联网): 解析规则/包集合静态断言/release 日期刷新
          # 任何一条失败即构建失败, 不让规则回归拖到出图后才发现
          sh shell/tests/run-all.sh

      - name: Save Custom Router IP
        run: |
          mkdir -p "${{ github.workspace }}/custom"
          echo "${{ inputs.custom_router_ip }}" > "${{ github.workspace }}/custom/custom_router_ip.txt"

      - name: Build ImmortalWrt firmware
        run: |
          luci_version="${{ inputs.luci_version }}"
          profile="${{ inputs.profile }}"
          include_docker="${{ inputs.include_docker }}"

          # 官方 docker 镜像有点版本标签 x86-64-openwrt-<version>。
          # 镜像版本必须跟 luci_version 一致: ImageBuilder tarball 里的
          # repositories 文件写死了点版本(apk 实际从那儿取包), 而 luci_version
          # 还决定了解析用的 index.json 和固件运行时的源, 三者要同版本。
          image_tag="x86-64-openwrt-${luci_version}"

          config_file="imm.config"

          # 只构建一档。ImageBuilder 的产物文件名由版本/架构/镜像类型决定,
          # 不含 rootfs 大小(ROOTFS_PARTSIZE 只影响分区大小), 多档会写进同一个
          # 路径互相覆盖, 最终只剩最后一档且与用户预期不符 —— 所以这里只保留单档。
          echo "Building for profile: $profile (luci_version=$luci_version, image=$image_tag)"
          docker run --rm -i \
            --user root \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
            -v "${{ github.workspace }}/custom:/home/build/immortalwrt/files/etc/config" \
            -v "${{ github.workspace }}/x86-64/${config_file}:/home/build/immortalwrt/.config" \
            -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
            -v "${{ github.workspace }}/x86-64/build.sh:/home/build/immortalwrt/build.sh" \
            -e LUCI_VERSION=$luci_version \
            -e PROFILE=$profile \
            -e INCLUDE_DOCKER=$include_docker \
            -e ENABLE_PPPOE=${{ inputs.enable_pppoe }} \
            -e PPPOE_ACCOUNT=${{ inputs.pppoe_account }} \
            -e PPPOE_PASSWORD=${{ inputs.pppoe_password }} \
            immortalwrt/imagebuilder:$image_tag /bin/bash /home/build/immortalwrt/build.sh

      - name: Create info
        run: |
          cat > ${{ github.workspace }}/router-info.md <<EOF
          ## 📡 路由器后台信息

          - 🏠 **后台地址**: ${{ inputs.custom_router_ip }}
          - 👤 **用户名**: root
          - 🔑 **密码**: 无
          - 📦 **版本**: ${{ inputs.luci_version }}
          EOF

          if [ "${{ inputs.include_docker }}" == "yes" ]; then
            echo -e "\n#### 默认带docker" >> ${{ github.workspace }}/router-info.md
          else
            echo -e "\n#### 不带docker" >> ${{ github.workspace }}/router-info.md
          fi

      - name: Upload firmware as release (img)
        if: inputs.output_format == 'img'
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: Autobuild-x86-64
          body_path: ${{ github.workspace }}/router-info.md
          files: |
            ${{ github.workspace }}/bin/targets/x86/64/*squashfs-combined-efi.img.gz
          token: ${{ secrets.GITHUB_TOKEN }}

      # release 列表页显示的日期是 published_at, 它只在 release 从 draft 变成
      # published 时刷新。上面这一步走的是"找到已有 release 并覆盖同名资产",
      # published_at 会一直停在首次发布的时间, 页面于是显示过期日期。
      # 这里做一次 draft -> published 往返, 让日期跟随本次构建(资产不受影响)。
      - name: Refresh release publish date (img)
        if: inputs.output_format == 'img'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: sh shell/refresh-release-date.sh Autobuild-x86-64

      - name: Copy firmware for ISO
        if: inputs.output_format == 'iso'
        run: cp ${{ github.workspace }}/bin/targets/x86/64/*squashfs-combined-efi.img.gz ${{ github.workspace }}/

      - name: Upload firmware artifact (for ISO)
        if: inputs.output_format == 'iso'
        uses: actions/upload-artifact@v4
        with:
          name: firmware-img
          path: "*.img.gz"

  build_iso:
    runs-on: ubuntu-22.04
    needs: build
    if: inputs.output_format == 'iso'

    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: firmware-img

      - name: Clone img-installer
        run: git clone https://github.com/wukongdaily/img-installer.git

      - name: Set executable permissions
        run: |
          chmod +x "${{ github.workspace }}/img-installer/custom.sh"
          chmod +x "${{ github.workspace }}/img-installer/supportFiles/custom/build.sh"

      - name: Build ISO
        run: |
          firmware_file=$(ls *squashfs-combined-efi.img.gz)
          cd img-installer
          bash autobuild/autobuild.sh "../$firmware_file"

      - name: Upload ISO to Release
        uses: softprops/action-gh-release@v2.2.1
        with:
          tag_name: "Custom-Installer-x86_64-ISO"
          body_path: "${{ github.workspace }}/img-installer/autobuild/info.md"
          files: |
            img-installer/output/custom-installer-x86_64.iso
          token: "${{ secrets.GITHUB_TOKEN }}"

      # 与 img release 同理: 刷新 published_at, 让列表页日期跟随本次构建
      - name: Refresh release publish date (ISO)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: sh shell/refresh-release-date.sh Custom-Installer-x86_64-ISO
