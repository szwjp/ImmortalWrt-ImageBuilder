name: Shell Tests

# 存在的唯一目的: 改代码后几秒内知道规则有没有被写坏。
# 之前测试只挂在手动触发的全量构建里, 一次提交把断言写红了两小时都没人发现,
# 下一次 dispatch 才在 "Run shell tests" 步骤撞上。这里不联网、不构建镜像。
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shell-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Shell syntax check
        run: |
          set -e
          # 所有 .sh 至少要被 bash 解析通过
          for f in $(git ls-files '*.sh'); do
            bash -n "$f"
            echo "OK  bash -n $f"
          done
          # 非 .sh 后缀、但在容器里以 bash 执行的入口脚本
          bash -n iso/supportFiles/custom/ddd
          echo "OK  bash -n iso/supportFiles/custom/ddd"
          # 以 /bin/sh(OpenWrt 上是 ash, CI 上是 dash)执行的脚本必须也是 POSIX 语法
          for f in files/etc/uci-defaults/99-custom.sh shell/refresh-release-date.sh shell/validate-ip.sh; do
            sh -n "$f"
            echo "OK  sh -n $f"
          done

      - name: Shell tests
        run: sh shell/tests/run-all.sh
